name: Max Atacadista JSON and JSONP Regression

on:
  pull_request:
    paths:
      - "api/max-flyers.ts"
      - "src/test/maxJsonpResponse.test.ts"
      - ".github/workflows/max-json-response-validation.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify genuine JSONP and raw flyer JSON behavior
        run: npx vitest run src/test/maxJsonpResponse.test.ts
      - name: Build frontend and API bundle
        run: npm run build
