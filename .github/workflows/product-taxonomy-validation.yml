name: Product Taxonomy Validation

on:
  push:
    branches:
      - feat/product-taxonomy-and-potato-families
  pull_request:
    paths:
      - 'src/lib/productTaxonomy.ts'
      - 'src/lib/flyerAnalysis.ts'
      - 'src/pages/OffersPage.tsx'
      - 'src/test/*Taxonomy*.test.ts'
      - 'src/test/potatoOfferReference.test.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
