name: Product Taxonomy Validation

on:
  push:
    branches:
      - feat/product-taxonomy-and-potato-families
  pull_request:
    paths:
      - 'src/lib/productTaxonomy.ts'
      - 'src/lib/flyerAnalysis.ts'
      - 'src/pages/OffersPage.tsx'
      - 'src/pages/SearchPage.tsx'
      - 'src/components/PriceQuoteSearchResult.tsx'
      - 'src/test/priceQuoteSearchResult.test.tsx'
      - 'src/test/*Taxonomy*.test.ts'
      - 'src/test/potatoOfferReference.test.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Taxonomy regression tests
        run: npx vitest run src/test/productTaxonomy.test.ts src/test/potatoOfferReference.test.ts src/test/priceQuoteSearchResult.test.tsx
      - name: Full existing unit tests
        if: always()
        run: npm test
      - name: Build
        if: always()
        run: npm run build
