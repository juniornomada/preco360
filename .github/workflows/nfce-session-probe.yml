name: NFC-e SP Public Form Probe
on:
  push:
    branches: [fix/restore-nfce-session-diagnostics-20261020]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/probe-nfce-session-entrypoint.mjs
