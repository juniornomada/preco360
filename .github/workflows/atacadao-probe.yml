name: Atacadao Probe

on:
  push:
    paths:
      - ".github/workflows/atacadao-probe.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Probe official Atacadão Marília flyer source
        run: |
          cat > /tmp/atacadao-probe.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const target = 'https://www.atacadao.com.br/loja/marilia';
          const interesting = /(flyer|folheto|encarte|leaflet|catalog|publication|pdf|api-middleware|folheteria|document|offer)/i;
          const events = [];
          const consoleLogs = [];

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({
            locale: 'pt-BR',
            timezoneId: 'America/Sao_Paulo',
            viewport: { width: 1440, height: 1100 },
            userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36',
          });
          const page = await context.newPage();

          page.on('console', msg => consoleLogs.push({ type: msg.type(), text: msg.text() }));
          page.on('request', req => {
            const url = req.url();
            if (interesting.test(url)) events.push({ kind: 'request', method: req.method(), resourceType: req.resourceType(), url });
          });
          page.on('response', async res => {
            const url = res.url();
            if (interesting.test(url)) {
              const h = res.headers();
              events.push({ kind: 'response', status: res.status(), contentType: h['content-type'] || null, url });
            }
          });

          let navStatus = null;
          let navError = null;
          try {
            const response = await page.goto(target, { waitUntil: 'domcontentloaded', timeout: 60000 });
            navStatus = response?.status() ?? null;
            await page.waitForTimeout(10000);
          } catch (e) {
            navError = String(e);
          }

          const title = await page.title().catch(() => '');
          const bodyText = await page.locator('body').innerText().catch(() => '');
          const html = await page.content().catch(() => '');

          const domUrls = await page.evaluate(() => {
            const out = new Set();
            for (const el of document.querySelectorAll('*')) {
              for (const a of ['href','src','data-src','data-url','data-href','data-document','data-pdf']) {
                const v = el.getAttribute?.(a);
                if (v) {
                  try { out.add(new URL(v, location.href).href); } catch {}
                }
              }
            }
            return [...out];
          }).catch(() => []);

          const htmlUrlMatches = [...new Set(
            [...html.matchAll(/https?:\\?\/\\?\/[^"'<>\\s]+/g)]
              .map(m => m[0].replaceAll('\\/','/').replace(/&amp;/g,'&'))
          )];

          const dataMatches = [];
          for (const key of ['urlFinalDocument','urlFinalDocumento','pdf','document','flyer','leaflet','folheto','encarte']) {
            const rx = new RegExp('.{0,250}' + key + '.{0,900}', 'ig');
            const m = html.match(rx);
            if (m) dataMatches.push(...m.slice(0,20));
          }

          const visibleFlyers = [];
          const lines = bodyText.split('\n').map(s => s.trim()).filter(Boolean);
          const idx = lines.findIndex(x => /Folhetos de ofertas/i.test(x));
          if (idx >= 0) visibleFlyers.push(...lines.slice(idx, idx + 80));

          let clickResult = null;
          const fim = page.getByText('Fim de Mês', { exact: true }).first();
          if (await fim.count()) {
            try {
              await fim.click({ timeout: 10000 });
              await page.waitForTimeout(8000);
              clickResult = { clicked: true, url: page.url() };
            } catch (e) {
              clickResult = { clicked: false, error: String(e) };
            }
          }

          const result = {
            ranAt: new Date().toISOString(),
            target,
            navStatus,
            navError,
            finalUrl: page.url(),
            title,
            bodyHasMarilia: /Marília/i.test(bodyText),
            bodyHasFlyers: /Folhetos de ofertas/i.test(bodyText),
            bodyHasFimDeMes: /Fim de Mês/i.test(bodyText),
            visibleFlyers,
            clickResult,
            interestingNetwork: events,
            interestingDomUrls: domUrls.filter(u => interesting.test(u)),
            interestingHtmlUrls: htmlUrlMatches.filter(u => interesting.test(u)),
            dataMatches,
            consoleLogs: consoleLogs.slice(0,100),
          };

          fs.writeFileSync('atacadao-probe.json', JSON.stringify(result, null, 2));
          await page.screenshot({ path: 'atacadao-probe.png', fullPage: true }).catch(() => {});
          console.log(JSON.stringify(result, null, 2));
          await browser.close();
          EOF
          node /tmp/atacadao-probe.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atacadao-probe
          path: |
            atacadao-probe.json
            atacadao-probe.png
          if-no-files-found: warn
