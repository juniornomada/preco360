name: Diagnose Search Beta Blank Screen

on:
  push:
    branches:
      - diag/search-beta-blank-page-20261019
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium for mobile browser check
        run: npx playwright install --with-deps chromium
      - name: Inspect live production routes (read-only)
        run: node scripts/diagnose-search-beta-live.mjs
